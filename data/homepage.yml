# Hero
hero:
  headline: "Metadata, removed."
  subhead: "Fast, private, and free. Strip EXIF data from photos, videos, and PDFs."
  download_url: "https://github.com/szTheory/exifcleaner/releases"
  github_repo: "szTheory/exifcleaner"
  screenshot: "/images/screenshots/light-processed.png"

# How it works
steps:
  - number: "1"
    title: "Drop"
    description: "Drag files or folders onto the window."
  - number: "2"
    title: "Clean"
    description: "Metadata is stripped instantly."
  - number: "3"
    title: "Done"
    description: "Your files are private."

# Features
features:
  - title: "Batch Processing"
    description: "Process tens, hundreds, or even thousands of files at once. ExifCleaner handles them all without breaking a sweat."
    screenshot: "/images/screenshots/light-processed.png"
    alt: "ExifCleaner processing multiple files simultaneously"
  - title: "Dark Mode"
    description: "Automatically matches your operating system theme. Light or dark, ExifCleaner looks right at home."
    screenshot: "/images/screenshots/dark-processed.png"
    alt: "ExifCleaner in dark mode"
    # Gives this card dark window chrome instead of the default light titlebar.
    theme: "dark"
  - title: "Metadata Inspection"
    description: "See exactly what was stripped. Expand any file to view a before-and-after diff of removed metadata fields."
    screenshot: "/images/screenshots/metadata-diff.png"
    alt: "ExifCleaner metadata diff view"
  - title: "Privacy Controls"
    description: "Fine-tune what gets removed. Preserve orientation, save copies, strip extended attributes -- your choice."
    screenshot: "/images/screenshots/settings-open.png"
    alt: "ExifCleaner settings panel with privacy toggles"

# Cross-platform
cross_platform:
  title: "Available for macOS, Windows, and Linux."
  mac_screenshot: "/images/screenshots/light-processed.png"
  win_screenshot: "/images/screenshots/light-processed.png"
  linux_screenshot: "/images/screenshots/light-processed.png"

# Language support
languages:
  title: "Your language, built in."
  subtitle: "24+ languages. No downloads, no plugins."
  screenshot: "/images/screenshots/language-switch.png"
  alt: "ExifCleaner language switching interface"

# Privacy and open source
privacy:
  trust_line: "No network access. No telemetry. Verify it yourself."
  open_source_line: "Open source — verify our privacy claims yourself."
  github_url: "https://github.com/szTheory/exifcleaner"
  formats: "Images, videos, and PDFs. JPEG, PNG, WebP, TIFF, GIF, MP4, MOV, M4A, PDF, and more."

