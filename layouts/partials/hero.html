<section class="hero section">
  <div class="container">
    <h1 class="display hero__headline" data-reveal>{{ .Site.Data.homepage.hero.headline }}</h1>
    <p class="body-intro text-secondary hero__subhead" data-reveal>{{ .Site.Data.homepage.hero.subhead }}</p>

    <div class="hero__actions" data-reveal>
      <a href="{{ .Site.Data.homepage.hero.download_url }}" class="btn btn--primary">Download</a>
      <a href="https://github.com/{{ .Site.Data.homepage.hero.github_repo }}" target="_blank" rel="noopener noreferrer">
        <img src="https://img.shields.io/github/stars/{{ .Site.Data.homepage.hero.github_repo }}?style=social" alt="GitHub stars" width="100" height="20">
      </a>
    </div>

    <div class="hero__screenshot" data-tilt data-reveal>
      <div class="screenshot-frame">
        <div class="screenshot-frame__titlebar">
          <svg class="screenshot-frame__dots" width="54" height="14" viewBox="0 0 54 14" aria-hidden="true">
            <circle cx="7" cy="7" r="5.5" fill="#FF5F57"/>
            <circle cx="27" cy="7" r="5.5" fill="#FEBC2E"/>
            <circle cx="47" cy="7" r="5.5" fill="#28C840"/>
          </svg>
          <span class="screenshot-frame__title">ExifCleaner</span>
        </div>
        <img src="{{ .Site.Data.homepage.hero.screenshot }}" alt="ExifCleaner application window showing processed files" loading="eager" width="1200" height="800">
      </div>
    </div>
  </div>
</section>
