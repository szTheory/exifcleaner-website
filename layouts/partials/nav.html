<nav class="nav" id="nav">
  <div class="container nav__inner">
    <a href="/" class="nav__logo" aria-label="ExifCleaner home">ExifCleaner</a>

    <button class="nav__hamburger" aria-label="Toggle menu" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <ul class="nav__links">
      {{ range .Site.Menus.main }}
      <li>
        {{ if eq .Name "Download" }}
        <a href="{{ .URL }}" class="nav__link nav__link--cta">{{ .Name }}</a>
        {{ else }}
        <a href="{{ .URL }}" class="nav__link"{{ if strings.HasPrefix .URL "http" }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </li>
      {{ end }}
    </ul>
  </div>
</nav>
